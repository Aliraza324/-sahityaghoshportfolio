<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Primary SEO -->
  <title>Codesinc — World's Finest Technology Hub</title>
  <meta name="description"
    content="Codesinc is a B2B technology company delivering cutting-edge software solutions, web and mobile app development, AI-driven innovations, and digital transformation services." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.codes-inc.com/" />
  <meta property="og:title" content="Codesinc — World's Finest Technology Hub" />
  <meta property="og:description"
    content="Web & Mobile Development • Software Engineering • AI • DevOps • Cloud • Digital Transformation" />
  <meta property="og:image" content="/preview.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.codes-inc.com/" />
  <meta name="twitter:title" content="Codesinc — World's Finest Technology Hub" />
  <meta name="twitter:description"
    content="Web & Mobile Development • Software Engineering • AI • DevOps • Cloud • Digital Transformation" />
  <meta name="twitter:image" content="/preview.png" />
</head>
